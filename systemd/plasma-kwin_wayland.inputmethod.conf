[Unit]
# 这里只声明 Wants,不声明 After。
#
# 之前写了 After=fcitx5.service,结果和 fcitx5.service 自己的
# After=graphical-session.target 形成环:
#   fcitx5.service → graphical-session.target → plasma-workspace.target
#                  → plasma-core.target → plasma-kwin_wayland.service → fcitx5.service
# systemd 只能靠 "Job fcitx5.service/start deleted to break ordering cycle"
# 硬砍,启动日志里全是警告。
#
# Wants= 足以保证 fcitx5 在同一个事务里被拉起来;而"daemon 还没就位就 spawn
# 启动器"这个竞态,由 ~/.local/bin/fcitx5-wayland-launcher 包装器自己轮询
# 总线名归属(最多等 10 秒)来解决,不需要靠 systemd 的排序。
Wants=fcitx5.service

[Service]
# KWin 的 Wayland 输入法交接。
#
# 之前的版本写的是 --inputmethod=/usr/lib/fcitx5-wayland-launcher,
# 但那个文件**根本不存在**(fcitx5 没装成 pacman 包,那一版是手动 cp 进系统
# 镜像的,SteamOS A/B 更新后必然消失)。KWin 拿不到输入��启动器,
# zwp_text_input_v2/v3 协议就没人接管 —— 原生 Wayland 应用
# (kate / konsole / Dolphin / Plasma 搜索框)因此**从���就打不出中文**,
# 跟 daemon 状态无关。
#
# 现在整条链路都在 /home 分区里,SteamOS 更新不会动它,也不需要 sudo:
#   ~/.local/bin/fcitx5-wayland-launcher  ->  ~/.local/share/fcitx5-host/libexec/fcitx5-wayland-launcher
# 包装器还会在执行前确认守护进程已就位,避免"启动器跑早了连不上 daemon"。
ExecStart=
ExecStart=/usr/bin/kwin_wayland_wrapper --xwayland --inputmethod=%h/.local/bin/fcitx5-wayland-launcher
