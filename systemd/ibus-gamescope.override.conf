[Unit]
# 掌机模式(游戏会话)里,Steam 客户端是由 steam-launcher.service 拉起来的,
# 而屏幕键盘(OSK)要用的 IBus 守护进程是 ibus-gamescope.service。
# 这两个单元原本是并行启动的 —— 有实测记录:10月23 23:05:34 两者同时 "Starting",
# Steam 客户端 23:05:37 才真正起来,中间只有 3 秒窗口。
# Steam 客户端启动时立刻调用 IBus.bus_new() + get_engines_by_names(),
# 一旦这时候总线名还没被真正的 ibus-daemon 拿到,客户端就会把
# "所有 CJK 引擎都不存在" 记死(ConnectHandler 只在 connected 时刷新一次引擎表),
# 结果就是整个会话里 OSK 显示 "Keyboard_IME_Not_available" —— 掌机模式没有中文。
#
# 加这条 Before= 让 IBus 守护进程(它自己是 Type=dbus,拿到总线名才算启动完)
# 一定排在 Steam 客户端之前,消除这个竞态。
#
# 不会形成循环:两个单元都是 After=graphical-session.target + PartOf=graphical-session.target,
# Before= 只是加了一条单向边。
Before=steam-launcher.service
